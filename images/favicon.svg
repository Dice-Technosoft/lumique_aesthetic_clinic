<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="lumiqueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8101E"/>
      <stop offset="100%" stop-color="#9A0D17"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Luxury Badge -->
  <rect width="512" height="512" rx="100" fill="url(#lumiqueGrad)"/>
  
  <!-- Outer Gold/White Ring -->
  <circle cx="256" cy="200" r="120" fill="none" stroke="#ffffff" stroke-width="12"/>
  
  <!-- Inner L+ Monogram -->
  <text x="256" y="240" font-family="'Playfair Display', Georgia, serif" font-size="140" font-weight="700" fill="#ffffff" text-anchor="middle">L</text>
  <text x="325" y="160" font-family="'Inter', sans-serif" font-size="64" font-weight="900" fill="#F5D67D" text-anchor="middle">✦</text>
  
  <!-- Lumique Brand Name -->
  <text x="256" y="380" font-family="'Playfair Display', Georgia, serif" font-size="62" font-weight="700" letter-spacing="4" fill="#ffffff" text-anchor="middle">LUMIQUE</text>
  <text x="256" y="425" font-family="'Inter', sans-serif" font-size="20" font-weight="600" letter-spacing="8" fill="#F5D67D" text-anchor="middle">AESTHETIC CLINIC</text>
</svg>
